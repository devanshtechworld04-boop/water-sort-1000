<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Water Sort 1000</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff; font-family: system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 16px; background: rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .level-badge { font-size: 1.15rem; font-weight: 800; color: #38bdf8; }
    .controls { display: flex; gap: 8px; }
    button {
      background: #334155; color: #fff; border: 1px solid #475569;
      padding: 8px 10px; border-radius: 10px; font-weight: 700; font-size: 0.8rem;
      display: flex; align-items: center; gap: 4px; cursor: pointer; transition: 0.15s;
    }
    button:active { transform: scale(0.94); }
    button.ad-btn { background: linear-gradient(135deg, #f59e0b, #d97706); border: none; color: #000; }
    #board {
      flex: 1; display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
      align-content: center; gap: 18px 14px; padding: 18px 12px 75px 12px; overflow-y: auto;
    }
    .tube {
      width: 48px; height: 168px; border: 3px solid rgba(255,255,255,0.75);
      border-top: none; border-radius: 0 0 24px 24px;
      display: flex; flex-direction: column-reverse; overflow: hidden;
      background: rgba(255,255,255,0.06); cursor: pointer;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
    }
    .tube.selected {
      transform: translateY(-20px);
      border-color: #38bdf8;
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.45);
    }
    .tube.completed {
      border-color: #4ade80;
      box-shadow: 0 0 18px rgba(74, 222, 128, 0.4);
    }
    .water {
      width: 100%; height: 25%;
      transition: height 0.25s ease;
      border-top: 1px solid rgba(255,255,255,0.18);
    }
    #win-modal {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.94);
      display: none; flex-direction: column; justify-content: center; align-items: center;
      z-index: 100; text-align: center; padding: 20px;
    }
    #win-modal h1 { font-size: 2.1rem; color: #4ade80; margin-bottom: 6px; }
    #win-modal p { color: #cbd5e1; margin-bottom: 22px; font-size: 1.05rem; }
    .modal-actions { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 260px; }
    #next-btn {
      background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff;
      border: none; padding: 14px; font-size: 1.1rem; border-radius: 14px; justify-content: center;
    }
    #skip-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706); color: #000;
      border: none; padding: 12px; font-size: 0.95rem; border-radius: 14px; justify-content: center;
    }
  </style>
</head>
<body>

<header>
  <div class="level-badge" id="level-title">LVL 1/1000</div>
  <div class="controls">
    <button onclick="restartLevel()">↻</button>
    <button class="ad-btn" onclick="handleUndo()">↶ Undo</button>
    <button class="ad-btn" onclick="handleExtraTube()">+1 Tube</button>
  </div>
</header>

<div id="board"></div>

<div id="win-modal">
  <h1>LEVEL CLEARED!</h1>
  <p id="win-sub">Awesome sorting!</p>
  <div class="modal-actions">
    <button id="next-btn" onclick="nextLevel()">NEXT LEVEL ➔</button>
    <button id="skip-btn" onclick="skipTwoLevels()">⏩ +2 LEVELS BONUS (AD)</button>
  </div>
</div>

<script>
  // --- 1. ALL ADMOB AD UNITS ---
  const AD_UNITS = {
    appOpen: 'ca-app-pub-5317235020851620/1880905256',
    banner: 'ca-app-pub-5317235020851620/2289913450',
    interstitial: 'ca-app-pub-5317235020851620/6967525065',
    rewardedInterstitial: 'ca-app-pub-5317235020851620/9402116716',
    rewarded: 'ca-app-pub-5317235020851620/6584381682',
    nativeAdvanced: 'ca-app-pub-5317235020851620/3716731101'
  };

  let AdMobPlugin = null;

  async function initAdMob() {
    try {
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AdMob) {
        AdMobPlugin = window.Capacitor.Plugins.AdMob;
        await AdMobPlugin.initialize({ initializeForTesting: false });

        // Show App Open Ad on launch if supported
        if (AdMobPlugin.showAppOpenAd) {
          try {
            await AdMobPlugin.prepareAppOpenAd({ adId: AD_UNITS.appOpen });
            await AdMobPlugin.showAppOpenAd();
          } catch (e) {}
        }

        showBannerAd();
        prepareInterstitial();
        prepareRewarded();
        prepareRewardedInterstitial();
      }
    } catch (e) { console.log("Running in browser mode"); }
  }

  async function showBannerAd() {
    if (!AdMobPlugin) return;
    try {
      await AdMobPlugin.showBanner({
        adId: AD_UNITS.banner,
        adSize: 'ADAPTIVE_BANNER',
        position: 'BOTTOM_CENTER',
        margin: 0
      });
    } catch (e) {}
  }

  async function prepareInterstitial() {
    if (!AdMobPlugin) return;
    try { await AdMobPlugin.prepareInterstitial({ adId: AD_UNITS.interstitial }); } catch (e) {}
  }

  async function showInterstitialIfDue(lvl) {
    if (!AdMobPlugin || lvl % 3 !== 0) return;
    try {
      await AdMobPlugin.showInterstitial();
      prepareInterstitial();
    } catch (e) { prepareInterstitial(); }
  }

  async function prepareRewarded() {
    if (!AdMobPlugin) return;
    try { await AdMobPlugin.prepareRewarded({ adId: AD_UNITS.rewarded }); } catch (e) {}
  }

  async function showRewardedAd(onRewardCallback) {
    if (!AdMobPlugin) { onRewardCallback(); return; }
    try {
      await AdMobPlugin.showRewarded();
      onRewardCallback();
      prepareRewarded();
    } catch (e) {
      alert("Ad is loading, please try again in 3 seconds.");
      prepareRewarded();
    }
  }

  async function prepareRewardedInterstitial() {
    if (!AdMobPlugin || !AdMobPlugin.prepareRewardedInterstitial) return;
    try { await AdMobPlugin.prepareRewardedInterstitial({ adId: AD_UNITS.rewardedInterstitial }); } catch (e) {}
  }

  async function showRewardedInterstitialAd(onRewardCallback) {
    if (!AdMobPlugin) { onRewardCallback(); return; }
    try {
      if (AdMobPlugin.showRewardedInterstitial) {
        await AdMobPlugin.showRewardedInterstitial();
      } else {
        await AdMobPlugin.showRewarded();
      }
      onRewardCallback();
      prepareRewardedInterstitial();
    } catch (e) {
      showRewardedAd(onRewardCallback);
    }
  }

  // --- 2. SOUND ENGINE ---
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playTone(freq, duration, type = 'sine') {
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.35, audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  // --- 3. 1000 LEVELS SEEDED GENERATOR ---
  const PALETTE = [
    '#ef4444', '#3b82f6', '#22c55e', '#eab308', '#a855f7',
    '#ec4899', '#06b6d4', '#f97316', '#84cc16', '#6366f1',
    '#14b8a6', '#f43f5e'
  ];

  let currentLevel = parseInt(localStorage.getItem('ws_level') || '1', 10);
  if (currentLevel > 1000) currentLevel = 1000;

  let tubes = [];
  let initialTubes = [];
  let moveHistory = [];
  let selectedIdx = null;
  let extraTubeAdded = false;

  function mulberry32(seed) {
    return function() {
      let t = seed += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function generateLevel(levelNum) {
    const rng = mulberry32(levelNum * 9973);
    let numColors = 3;
    if (levelNum > 5) numColors = 4;
    if (levelNum > 20) numColors = 5;
    if (levelNum > 50) numColors = 6;
    if (levelNum > 120) numColors = 7;
    if (levelNum > 250) numColors = 8;
    if (levelNum > 450) numColors = 9;
    if (levelNum > 700) numColors = 10;
    if (levelNum > 900) numColors = 11;

    let pool = [];
    for (let c = 0; c < numColors; c++) {
      for (let k = 0; k < 4; k++) pool.push(PALETTE[c]);
    }

    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }

    for (let t = 0; t < numColors; t++) {
      let tube = pool.slice(t * 4, (t + 1) * 4);
      if (tube.every(col => col === tube[0])) {
        const swapTubeIdx = (t + 1) % numColors;
        [pool[t * 4], pool[swapTubeIdx * 4]] = [pool[swapTubeIdx * 4], pool[t * 4]];
      }
    }

    let generated = [];
    for (let t = 0; t < numColors; t++) {
      generated.push(pool.slice(t * 4, (t + 1) * 4));
    }
    generated.push([]);
    generated.push([]);
    return generated;
  }

  // --- 4. GAMEPLAY LOGIC ---
  function loadLevel(lvl) {
    currentLevel = lvl;
    localStorage.setItem('ws_level', currentLevel);
    document.getElementById('level-title').innerText = `LVL ${currentLevel}/1000`;
    document.getElementById('win-modal').style.display = 'none';
    initialTubes = generateLevel(currentLevel);
    tubes = JSON.parse(JSON.stringify(initialTubes));
    moveHistory = [];
    selectedIdx = null;
    extraTubeAdded = false;
    renderBoard();
  }

  function restartLevel() {
    tubes = JSON.parse(JSON.stringify(initialTubes));
    moveHistory = [];
    selectedIdx = null;
    extraTubeAdded = false;
    playTone(300, 0.12);
    renderBoard();
  }

  function handleUndo() {
    if (moveHistory.length === 0) return;
    showRewardedAd(() => {
      tubes = JSON.parse(moveHistory.pop());
      selectedIdx = null;
      playTone(350, 0.12);
      renderBoard();
    });
  }

  function handleExtraTube() {
    if (extraTubeAdded) {
      alert("Extra tube already added!");
      return;
    }
    showRewardedAd(() => {
      tubes.push([]);
      extraTubeAdded = true;
      playTone(520, 0.18);
      renderBoard();
    });
  }

  function skipTwoLevels() {
    showRewardedInterstitialAd(() => {
      const target = Math.min(1000, currentLevel + 2);
      loadLevel(target);
    });
  }

  function isTubeComplete(tube) {
    return tube.length === 4 && tube.every(c => c === tube[0]);
  }

  function onTubeClick(idx) {
    if (selectedIdx === null) {
      if (tubes[idx].length === 0 || isTubeComplete(tubes[idx])) return;
      selectedIdx = idx;
      playTone(420, 0.08);
      renderBoard();
      return;
    }

    if (selectedIdx === idx) {
      selectedIdx = null;
      playTone(320, 0.08);
      renderBoard();
      return;
    }

    const src = tubes[selectedIdx];
    const dst = tubes[idx];

    if (dst.length < 4) {
      const topColor = src[src.length - 1];
      if (dst.length === 0 || dst[dst.length - 1] === topColor) {
        moveHistory.push(JSON.stringify(tubes));
        while (src.length > 0 && dst.length < 4 && src[src.length - 1] === topColor) {
          dst.push(src.pop());
        }
        playTone(580, 0.16);
        selectedIdx = null;
        renderBoard();
        checkWin();
        return;
      }
    }

    if (tubes[idx].length > 0 && !isTubeComplete(tubes[idx])) {
      selectedIdx = idx;
      playTone(420, 0.08);
    } else {
      selectedIdx = null;
      playTone(200, 0.12, 'sawtooth');
    }
    renderBoard();
  }

  function checkWin() {
    const won = tubes.every(t => t.length === 0 || isTubeComplete(t));
    if (won) {
      setTimeout(() => {
        playTone(660, 0.3);
        if (navigator.vibrate) navigator.vibrate([80, 50, 120]);
        document.getElementById('win-sub').innerText = `Level ${currentLevel} Completed!`;
        document.getElementById('win-modal').style.display = 'flex';
        showInterstitialIfDue(currentLevel);
      }, 280);
    }
  }

  function nextLevel() {
    if (currentLevel < 1000) {
      loadLevel(currentLevel + 1);
    } else {
      alert("Congratulations! All 1000 Levels Completed!");
      loadLevel(1);
    }
  }

  function renderBoard() {
    const board = document.getElementById('board');
    board.innerHTML = '';
    tubes.forEach((tube, i) => {
      const div = document.createElement('div');
      div.className = 'tube' + (selectedIdx === i ? ' selected' : '') + (isTubeComplete(tube) ? ' completed' : '');
      div.onclick = () => onTubeClick(i);

      tube.forEach(color => {
        const layer = document.createElement('div');
        layer.className = 'water';
        layer.style.backgroundColor = color;
        div.appendChild(layer);
      });
      board.appendChild(div);
    });
  }

  window.addEventListener('DOMContentLoaded', () => {
    initAdMob();
    loadLevel(currentLevel);
  });
</script>
</body>
  </html>
