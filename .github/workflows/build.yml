name: Build Signed APK & AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & Add Android
        run: |
          npm install --legacy-peer-deps
          npx cap add android

      - name: Configure AdMob App ID in AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<\/application>/<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-5317235020851620~3422114455"\/><\/application>/' $MANIFEST

      - name: Generate Signing Keystore & Configure Gradle
        run: |
          keytool -genkey -v -keystore android/app/release.keystore -alias watersort -keyalg RSA -keysize 2048 -validity 10000 -storepass water123 -keypass water123 -dname "CN=WaterSort, OU=Dev, O=Studio, L=City, S=State, C=IN"
          printf '\nandroid {\n  signingConfigs {\n    release {\n      storeFile file("release.keystore")\n      storePassword "water123"\n      keyAlias "watersort"\n      keyPassword "water123"\n    }\n  }\n  buildTypes {\n    release {\n      signingConfig signingConfigs.release\n      minifyEnabled false\n    }\n  }\n}\n' >> android/app/build.gradle

      - name: Sync Capacitor & Build APK + AAB
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Water-Sort-1000-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Water-Sort-1000-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          
