name: Build Water Sort 1000 APK & AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & Add Android
        run: |
          npm install --legacy-peer-deps
          npx cap add android

      - name: Configure AdMob App ID in AndroidManifest
        run: |
          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              content = f.read()
          meta = """        <meta-data
              android:name="com.google.android.gms.ads.APPLICATION_ID"
              android:value="ca-app-pub-5317235020851620~9004631084"/>\n    </application>"""
          content = content.replace("</application>", meta)
          with open(path, "w") as f:
              f.write(content)
          '

      - name: Sync Capacitor & Build Debug APK + Release AAB
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew bundleRelease

      - name: Sign Release AAB for Play Store
        run: |
          keytool -genkey -v -keystore release.keystore -alias watersort -keyalg RSA -keysize 2048 -validity 10000 -storepass water123 -keypass water123 -dname "CN=WaterSort, OU=Dev, O=Studio, L=City, S=State, C=IN"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass water123 -keypass water123 android/app/build/outputs/bundle/release/app-release.aab watersort

      - name: Upload Phone-Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Water-Sort-1000-Phone-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: Water-Sort-1000-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          
