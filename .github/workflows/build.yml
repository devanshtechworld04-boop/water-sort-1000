name: Build Signed APK & AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & Add Android
        run: |
          npm install
          npx cap add android

      - name: Configure AdMob App ID in AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<\/application>/<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-5317235020851620~YOUR_APP_ID"ca-app-pub-5317235020851620~9004631084\/><\/application>/' $MANIFEST

      - name: Generate Signing Keystore & Configure Gradle
        run: |
          keytool -genkey -v -keystore android/app/release.keystore -alias watersort -keyalg RSA -keysize 2048 -validity 10000 -storepass water123 -keypass water123 -dname "CN=WaterSort, OU=Dev, O=Studio, L=City, S=State, C=IN"
          cat << 'EOF' >> android/app/build.gradle
          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword "water123"
                      keyAlias "watersort"
                      keyPassword "water123"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: Sync Capacitor & Build APK + AAB
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Upload Release APK (Install Directly on Phone)
        uses: actions/upload-artifact@v4
        with:
          name: Water-Sort-1000-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Release AAB (For Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: Water-Sort-1000-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          
