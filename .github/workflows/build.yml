name: Build Signed APK & AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & Add Android
        run: |
          npm install --legacy-peer-deps
          npx cap add android

      - name: Configure AdMob App ID in AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<\/application>/<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-5317235020851620~3422114455"\/><\/application>/' $MANIFEST

      - name: Sync Capacitor & Build Unsigned Release APK + AAB
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Sign APK with V1+V2+V3 (Fixes Something Went Wrong Error)
        run: |
          keytool -genkey -v -keystore release.keystore -alias watersort -keyalg RSA -keysize 2048 -validity 10000 -storepass water123 -keypass water123 -dname "CN=WaterSort, OU=Dev, O=Studio, L=City, S=State, C=IN"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS/zipalign -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk app-aligned.apk
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-key-alias watersort --ks-pass pass:water123 --key-pass pass:water123 --out Water-Sort-1000-Signed.apk app-aligned.apk
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass water123 -keypass water123 android/app/build/outputs/bundle/release/app-release.aab watersort

      - name: Upload Signed APK (Install on Phone)
        uses: actions/upload-artifact@v4
        with:
          name: Water-Sort-1000-Signed-APK
          path: Water-Sort-1000-Signed.apk

      - name: Upload Signed AAB (For Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: Water-Sort-1000-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          
